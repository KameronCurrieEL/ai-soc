<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · VARDR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-wrap">
    <form class="login-card" method="post" action="{{ url_for('login_post') }}">
      <div class="login-brand">
        <strong>VARDR</strong><span>Analyst console · sign in</span>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}
      {% endwith %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Username<input name="username" autocomplete="username" autofocus required maxlength="40"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Sign in</button>
      <p class="login-note">Local lab · bound to 127.0.0.1 · every action is attributed to your account.</p>
    </form>
  </main>
</body>
</html>
